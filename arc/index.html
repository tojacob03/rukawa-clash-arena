<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0C0A" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Edition before first paint: Urushi (dark) unless "papier" (Washi) or "system" is stored.
      try {
        var t = localStorage.getItem("waza-arc.theme");
        if (t === "papier" || t === "system") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Waza Arc</title>
    <meta name="description" content="Waza Arc: BJJ-Fortschritt als Anime-RPG. Trainings kurz eintragen, eine Tagesquest mitzählen, Fortschritt als Zweig mit 193 Techniken." />
    <!-- Beta: noch nicht in Suchmaschinen, bis das Backend steht. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/arc/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/arc/icon-192.png" />
    <link rel="manifest" href="/arc/manifest.webmanifest" />
    <meta property="og:title" content="Waza Arc" />
    <meta property="og:description" content="BJJ-Fortschritt als Anime-RPG: Tagesquests, Zweig, Seekarte, Power Level." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="arc-root"></div>
    <noscript>Waza Arc braucht JavaScript.</noscript>
    <script type="module" src="/src/arc/main.tsx"></script>
  </body>
</html>
